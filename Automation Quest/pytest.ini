[pytest]
addopts = -ra --strict-markers --html=output/reports/report.html --self-contained-html --junitxml=output/reports/junit.xml --screenshot=only-on-failure --tracing=retain-on-failure --video=retain-on-failure
testpaths = tests
markers =
    smoke: critical checks that should run first
    web: browser-based web checks
    android: Android device or emulator checks
    accessibility: accessibility-focused checks